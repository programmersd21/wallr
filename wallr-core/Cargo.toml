[package]
name = "wallr-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for wallr - wallpaper engine, GPU transitions, theme provider dispatch, and video playback."
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
include = ["src/**", "Cargo.toml", "README.md", "shaders/**"]

[lib]
name = "wallr_core"
path = "src/lib.rs"
bench = false  # Disable benchmarks for faster builds

[features]
default = []
# Statically link the system FFmpeg libraries (used for release binaries so
# they keep working after system FFmpeg ABI upgrades). Requires static FFmpeg
# libraries available to pkg-config (e.g. via vcpkg or a --enable-static build).
static-ffmpeg = ["ffmpeg-next/static"]

[dependencies]
# Shared protocol (effects, IPC vocabulary, CLI shapes, config schema)
wallr-common.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# CLI
clap.workspace = true

# Async runtime
tokio.workspace = true

# Logging
tracing.workspace = true

# Image processing
image.workspace = true
fast_image_resize.workspace = true
gif = "0.13"
zstd = "0.13"

# Graphics
wgpu.workspace = true
raw-window-handle.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }

# Wayland
wayland-client.workspace = true
wayland-protocols.workspace = true
smithay-client-toolkit.workspace = true
wayland-backend.workspace = true

# File operations
dirs.workspace = true
tempfile = "3"

# Utilities
sha2.workspace = true
hex.workspace = true

# Video support
ffmpeg-next.workspace = true
crossbeam-channel.workspace = true

# Linux allocator tuning (mallopt); see `daemon::tune_allocator`.
# Pinned to the version already in Cargo.lock: the registry index mirror
# only advertises prereleases, so a caret requirement cannot resolve.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

# WGSL validation for bundled shaders (tests only, never linked into the binary).
# Pinned to the Cargo.lock version like libc above: the index mirror cannot
# resolve caret requirements for this crate either.
[dev-dependencies]
naga = { version = "=24.0.0", features = ["wgsl-in"] }
