[package]
name = "wallr-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for wallr — wallpaper engine, animation system, theme provider dispatch, and package management."
readme = "README.md"
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
include = ["src/**", "Cargo.toml", "README.md", "shaders/**"]

[lib]
name = "wallr_core"
path = "src/lib.rs"
bench = false  # Disable benchmarks for faster builds

[features]
default = []
# Statically link the system FFmpeg libraries (used for release binaries so
# they keep working after system FFmpeg ABI upgrades). Requires static FFmpeg
# libraries available to pkg-config (e.g. via vcpkg or a --enable-static build).
static-ffmpeg = ["ffmpeg-next/static"]

[dependencies]
# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# CLI
clap.workspace = true
colored.workspace = true

# Async runtime
tokio.workspace = true

# Logging
tracing.workspace = true

# Image processing
image.workspace = true
gif = "0.13"
zstd = "0.13"

# Graphics
wgpu.workspace = true
naga.workspace = true
raw-window-handle.workspace = true
winit.workspace = true
pollster.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }

# Wayland
wayland-client.workspace = true
wayland-protocols.workspace = true
smithay-client-toolkit.workspace = true
wayland-backend.workspace = true

# File operations
notify.workspace = true
dirs.workspace = true
glob.workspace = true
which.workspace = true
tempfile = "3"

# Utilities
sha2.workspace = true
hex.workspace = true
humansize.workspace = true

# Video support
ffmpeg-next.workspace = true
crossbeam-channel.workspace = true
