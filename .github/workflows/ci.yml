name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'wallr/**'
      - 'wallr-core/**'
      - 'wallr-common/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'wallr/**'
      - 'wallr-core/**'
      - 'wallr-common/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libegl-dev \
            libgles-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            pkg-config
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Check architecture dependency versions
        run: |
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          version = manifest["workspace"]["dependencies"]["smithay-client-toolkit"]["version"]
          architecture = Path("docs/architecture.md").read_text()
          if not re.search(rf"SCTK {re.escape(version)}\b", architecture):
              raise SystemExit(f"docs/architecture.md must identify SCTK {version}")
          PY
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify workspace version consistency
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -re '.packages[] | select(.name=="wallr") | .version')"
          for crate in wallr wallr-common wallr-core; do
            crate_version="$(cargo metadata --no-deps --format-version 1 | jq -re ".packages[] | select(.name==\"$crate\") | .version")"
            test "$crate_version" = "$VERSION"
          done
          test "$VERSION" = "0.8.1"
          grep -q "## \[0.8.1\]" CHANGELOG.md

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libegl-dev \
            libgles-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            lld \
            pkg-config
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
