name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.3.2)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libegl-dev \
            libgles-dev \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            cmake \
            ninja-build \
            nasm

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg build artifacts
        uses: actions/cache@v4
        with:
          path: /opt/vcpkg/installed
          key: vcpkg-linux-static-ffmpeg
          restore-keys: |
            vcpkg-linux-

      - name: Build static FFmpeg
        env:
          VCPKG_ROOT: /opt/vcpkg
        run: |
          /opt/vcpkg/vcpkg install \
            'ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-linux-static' \
            --overlay-triplets="$GITHUB_WORKSPACE/.github/vcpkg-triplets"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-static-ffmpeg

      - name: Build release binary with static FFmpeg
        env:
          MEDIA_PREFIX: /opt/vcpkg/installed/x64-linux-static
          PKG_CONFIG_PATH: /opt/vcpkg/installed/x64-linux-static/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: "1"
        run: cargo build --release --bin wallr --features static-ffmpeg

      - name: Verify binary is self-contained
        run: |
          ldd target/release/wallr | grep -E 'libav(a|util|codec|format|sw)' && { echo "ERROR: binary links dynamic FFmpeg libraries"; exit 1; } || echo "OK: no dynamic FFmpeg dependencies"

      - name: Prepare Release Asset
        run: |
          mkdir -p staging
          cp target/release/wallr staging/
          cp README.md staging/
          cp -r docs staging/
          cd staging
          tar -czf ../wallr-linux-amd64.tar.gz *
          cd ..

      - name: Determine Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ inputs.tag_name }}" >> $GITHUB_ENV
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="wallr") | .version')" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            wallr-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
