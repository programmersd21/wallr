<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181825"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="682" y1="92" x2="1122" y2="534" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8C75B8"/>
      <stop offset=".48" stop-color="#D49AAB"/>
      <stop offset="1" stop-color="#F2C49A"/>
    </linearGradient>
    <linearGradient id="ridge-back" x1="700" y1="315" x2="1180" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34304F"/>
      <stop offset="1" stop-color="#555070"/>
    </linearGradient>
    <linearGradient id="ridge-front" x1="704" y1="382" x2="1182" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25263E"/>
