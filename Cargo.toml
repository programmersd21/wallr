[workspace]
members = ["wallr", "wallr-common", "wallr-core"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Wallr Contributors"]
license = "MIT"
repository = "https://github.com/programmersd21/wallr"
description = "The wallpaper engine for Wayland - GPU transitions, video wallpapers, and theme pipeline integration."
categories = ["command-line-utilities", "rendering"]
keywords = ["wallpaper", "wayland", "wgpu", "daemon", "matugen"]
rust-version = "1.85"

# Optimized profile settings for faster compilation and better runtime performance
[profile.dev]
opt-level = 1      # Basic optimizations for faster dev builds
debug = true       # Keep debug symbols
incremental = true # Enable incremental compilation

[profile.release]
opt-level = 3     # Full optimizations
lto = "thin"      # Thin LTO for faster linking with good optimization
codegen-units = 1 # Better optimization, slower compile (worth it for release)
strip = true      # Strip symbols for smaller binary
debug = false     # No debug info in release

[profile.release-with-debug]
inherits = "release"
debug = true         # Release build with debug symbols
strip = false

# Fast development builds
[profile.dev.package."*"]
opt-level = 2 # Optimize dependencies even in dev mode

[workspace.dependencies]
wallr-common = { path = "wallr-common", version = "0.6.0" }
wallr-core = { path = "wallr-core", version = "0.6.0" }

# Core utilities
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"

# Async runtime
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "io-util",
    "net",
    "time",
    "macros",
    "signal",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }

# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
fast_image_resize = "6"

# Graphics
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
raw-window-handle = "0.6"

# Wayland
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = [
    "calloop",
] }
wayland-backend = { version = "0.3", features = ["client_system"] }

# File operations
dirs = "6"

# Crypto & utilities
sha2 = { version = "0.10", default-features = false }
hex = "0.4"

# Video support
ffmpeg-next = { version = "9.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
crossbeam-channel = "0.5"
